name: Build Processing Project

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxrender1 libxtst6 libxi6

      - name: Install Processing 4.3
        run: |
          wget https://github.com/processing/processing4/releases/download/processing-1293-4.3/processing-4.3-linux-x64.tgz
          tar -xvzf processing-4.3-linux-x64.tgz

      - name: Install Libraries
        run: |
          mkdir -p ~/sketchbook/libraries
          wget -O video.zip https://github.com/processing/processing-video/releases/download/latest/video.zip
          unzip video.zip -d ~/sketchbook/libraries/
          wget -O sound.zip https://github.com/processing/processing-sound/releases/download/v2.4.0/sound.zip
          unzip sound.zip -d ~/sketchbook/libraries/

      - name: Export Windows App
        run: |
          # Evitamos conflictos de nombres renombrando a la carpeta final
          mv source OutOfBounds
          mv OutOfBounds/source.pde OutOfBounds/OutOfBounds.pde
          mkdir -p $GITHUB_WORKSPACE/dist
          # Exportamos específicamente para windows
          xvfb-run ./processing-4.3/processing-java --sketch=$GITHUB_WORKSPACE/OutOfBounds --output=$GITHUB_WORKSPACE/dist --force --export --variant=windows-amd64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OutOfBounds-Game
          path: dist/windows-amd64/