name: Build Processing Project (Windows Native)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Processing 4.3
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/processing/processing4/releases/download/processing-1293-4.3/processing-4.3-windows-x64.zip -OutFile processing.zip
          Expand-Archive -Path processing.zip -DestinationPath .

      - name: Install Libraries
        shell: pwsh
        run: |
          $libPath = "$HOME\Documents\Processing\libraries"
          if (!(Test-Path $libPath)) { New-Item -ItemType Directory -Path $libPath -Force }
          
          # Video
          Invoke-WebRequest -Uri https://github.com/processing/processing-video/releases/download/latest/video.zip -OutFile video.zip
          Expand-Archive -Path video.zip -DestinationPath $libPath
          
          # Sound
          Invoke-WebRequest -Uri https://github.com/processing/processing-sound/releases/download/v2.4.0/sound.zip -OutFile sound.zip
          Expand-Archive -Path sound.zip -DestinationPath $libPath

      - name: Export Application
        shell: pwsh
        run: |
          # 1. Renombrar carpeta 'source' para cumplir con la regla de Processing
          Rename-Item -Path "source" -NewName "OutOfBounds"
          Rename-Item -Path "OutOfBounds\source.pde" -NewName "OutOfBounds.pde"
          
          # 2. Crear carpeta de salida absoluta
          $outPath = Join-Path $env:GITHUB_WORKSPACE "out"
          New-Item -ItemType Directory -Path $outPath -Force
          
          # 3. Exportar usando la ruta absoluta del ejecutable de Processing
          $procExe = Join-Path $env:GITHUB_WORKSPACE "processing-4.3\processing-java.exe"
          $sketchPath = Join-Path $env:GITHUB_WORKSPACE "OutOfBounds"
          
          & $procExe --sketch="$sketchPath" --output="$outPath" --force --export --variant=windows-amd64
          
          # 4. DEBUG: Listar archivos para confirmar creación en los logs
          Get-ChildItem -Path $outPath -Recurse

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OutOfBounds-Windows-App
          path: out/ # Captura TODO lo que haya en la carpeta de salida